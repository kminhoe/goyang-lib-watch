name: library-watch

on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 (UTC 기준, GitHub 사정으로 몇 분 늦을 수 있음)
  workflow_dispatch:
    inputs:
      report:
        description: "변화가 없어도 현재 상태 전체를 텔레그램으로 보내기"
        type: boolean
        default: false

permissions:
  contents: write   # state.json 을 저장소에 다시 커밋하기 위해 필요

concurrency:
  group: library-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check library
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT: ${{ inputs.report && '1' || '0' }}
        run: python watch.py

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "상태 변화 없음"
          else
            git commit -m "상태 업데이트"
            git pull --rebase
            git push
          fi
